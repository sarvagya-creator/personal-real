<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS box model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box1{
            background-color: rgb(245, 8, 67) ;
            color: rgb(251, 255, 9);
            padding: 10px;
            margin: 10px;
            border: 5px solid rgb(0, 0, 0);
            width: 200px;
            height: 100px;
            box-sizing: border-box;
            
        }
        .box2{
            background-color: rgb(0, 255, 34);
            color: rgb(162, 0, 236);
            padding: 10px;
            margin: 10px;
            border: 5px solid rgb(0, 0, 0);
            width: 200px;
            height: 100px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box1">I am Box</div>
    <div class="box2">I am box 2</div>
</body>

</html>
