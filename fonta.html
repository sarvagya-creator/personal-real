<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fonts</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    h1 {
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    p {
      font-family: 'baloo bhai 2', sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-decoration: underline;
      line-height: 40px;
      letter-spacing: 1px;

    }

    h2 {
      text-align: center;
      text-transform: uppercase;
      text-decoration-color: rgb(0, 247, 247);
      text-decoration: underline;
      /* text-decoration-style: wavy; */
      text-decoration-thickness: 7px;
      /* text-indent: 50px; */
      text-overflow: ellipsis;

    }

    .lorem {
      border: 2px solid rgb(201, 0, 0);
      width: 45px;
      text-overflow: ellipsis;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div>
    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorem nisi perferendis optio animi, sunt reprehenderit
      facere neque culpa laborum error a odit, ratione eligendi rem.</p>
    <pre>
    </div>
</body>
</html>
