<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 10px 8px rgb(0, 0, 0);
        }
        .text-shadow {
            text-shadow: 2px 2px 4px rgb(255, 0, 0);
            outline: 1px solid rgb(0, 0, 0);
            outline-offset: 1px ;
            border: 1px solid rgb(0, 0, 0);
            border-radius: 2px;
        }
        </style>
</head>
<body>
    <div class="box"> 
        Watashiwa box desu
    </div>
    <p class="text-shadow">
        This is a text with shadow</p>
</body>
</html>
